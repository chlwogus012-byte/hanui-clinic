backend:
  name: github
  repo: chlwogus012-byte/hanui-clinic
  branch: main
  base_url: https://hanui-clinic.vercel.app
  auth_endpoint: api/auth

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "site"
    label: "홈페이지 내용"
    files:
      - name: "site"
        label: "전체 내용 편집"
        file: "data/site.json"
        fields:
          - label: "병원 기본 정보"
            name: "clinic"
            widget: "object"
            fields:
              - { label: "병원 이름", name: "name", widget: "string" }
              - { label: "전화번호 (화면 표시용, 예: 031-8027-8275)", name: "phone", widget: "string" }
              - { label: "전화번호 (통화 연결용, 하이픈 포함)", name: "phoneLink", widget: "string" }
              - { label: "주소", name: "address", widget: "string" }
              - { label: "사업자등록번호", name: "businessRegNumber", widget: "string" }
              - { label: "대표원장 이름", name: "directorName", widget: "string" }

          - label: "메인 화면 (첫 화면)"
            name: "hero"
            widget: "object"
            fields:
              - { label: "작은 소개 문구", name: "eyebrow", widget: "string" }
              - { label: "큰 제목 (보통 병원 이름)", name: "title", widget: "string" }
              - { label: "진료 항목 소개 문구", name: "description", widget: "string" }
              - { label: "의료진 소개 문구", name: "sub", widget: "string" }

          - label: "진료 철학 섹션"
            name: "philosophy"
            widget: "object"
            fields:
              - { label: "첫째 줄", name: "titleLine1", widget: "string" }
              - { label: "강조 문구 (파란색으로 표시)", name: "titleHighlight", widget: "string" }
              - { label: "설명 문구", name: "description", widget: "text" }

          - label: "온담이 중요하게 생각하는 것 (5가지 핵심가치)"
            name: "values"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "아이콘 한자 1글자", name: "icon", widget: "string" }
              - { label: "제목", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }

          - label: "주요 진료 과목 목록"
            name: "programs"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "진료과목 이름", name: "title", widget: "string" }
              - { label: "설명", name: "description", widget: "text" }

          - label: "의료진 소개 목록"
            name: "doctors"
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "이름 (예: 김온담 원장)", name: "name", widget: "string" }
              - { label: "자격/전문분야", name: "title", widget: "string" }
              - { label: "사진 (비워두면 이름 첫 글자로 표시)", name: "photo", widget: "image", required: false }

          - label: "진료시간 및 예약 안내"
            name: "hours"
            widget: "object"
            fields:
              - { label: "평일", name: "weekday", widget: "string" }
              - { label: "토요일", name: "saturday", widget: "string" }
              - { label: "일요일 · 공휴일", name: "sundayHoliday", widget: "string" }
              - { label: "점심시간", name: "lunch", widget: "string" }
              - { label: "예약 안내 문구", name: "note", widget: "text" }

  - name: "columns"
    label: "건강칼럼"
    files:
      - name: "posts"
        label: "건강칼럼 목록"
        file: "data/columns.json"
        fields:
          - label: "글 목록"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "제목", name: "title", widget: "string" }
              - { label: "분류 태그 (예: 체질, 통증, 다이어트)", name: "tag", widget: "string" }
              - { label: "날짜", name: "date", widget: "date", format: "YYYY-MM-DD" }
              - { label: "대표 이미지", name: "image", widget: "image", required: false }
              - { label: "고유 ID (영문 소문자, 공백 없이, 예: new-post-1)", name: "id", widget: "string" }
              - { label: "본문 (문단 사이는 줄을 두 번 띄우기)", name: "body", widget: "text" }

  - name: "promo"
    label: "이벤트 팝업"
    files:
      - name: "promo"
        label: "팝업 설정"
        file: "data/promo.json"
        fields:
          - { label: "팝업 표시 여부", name: "enabled", widget: "boolean", default: true }
          - { label: "상단 안내문 (줄바꿈은 Enter)", name: "heading", widget: "text" }
          - { label: "할인 배지 문구 (줄바꿈은 Enter)", name: "badgeText", widget: "text" }
          - { label: "메인 타이틀", name: "title", widget: "string" }
          - { label: "서브 타이틀", name: "subtitle", widget: "string" }
          - label: "상품 그룹 (한 줄에 보여줄 묶음)"
            name: "rows"
            widget: "list"
            summary: "{{fields.items}} 개 상품"
            fields:
              - label: "상품"
                name: "items"
                widget: "list"
                summary: "{{name}}"
                fields:
                  - { label: "상품명", name: "name", widget: "string" }
                  - { label: "단위/수량 표시", name: "qty", widget: "string" }
                  - { label: "한정수량 강조(빨간색)", name: "limited", widget: "boolean", default: false }
                  - { label: "정가", name: "original", widget: "string" }
                  - { label: "할인가", name: "sale", widget: "string" }
